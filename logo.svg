<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 145" width="100%" height="100%">
  <defs>
    <!-- Ultra-Bright 24K Mirror Metallic Gold -->
    <linearGradient id="heavyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="12%" stop-color="#FFF2A1"/>
      <stop offset="28%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#92400E"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FFF9DB"/>
    </linearGradient>

    <!-- Sharp Beveled Specular Face -->
    <linearGradient id="bevelLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="35%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Deep Metallic Shadow -->
    <linearGradient id="goldBevelSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="40%" stop-color="#78350F"/>
      <stop offset="70%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#2D1100"/>
    </linearGradient>

    <!-- Metallic Platinum White -->
    <linearGradient id="platinumWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="80%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="glowGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Heavy 3D Cast Shadow -->
    <filter id="bold3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="goldGlint" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- NO OUTER RECTANGLE / NO OUTER BORDER (100% CLEAN & TRANSPARENT) -->

  <!-- ==================== PROMINENT 3D GOLD BULLION EMBLEM ==================== -->
  <g transform="translate(15, 6)" filter="url(#bold3D)">
    
    <!-- Heavy Gold Shield Ring -->
    <polygon points="65,4 108,22 125,65 108,108 65,123 22,108 5,65 22,22" 
             fill="#060c1c" stroke="url(#heavyGold)" stroke-width="3"/>
             
    <circle cx="65" cy="64" r="46" fill="#030713" stroke="url(#bevelLight)" stroke-width="1.5"/>

    <!-- LARGE SOLID 3D GOLD BULLION BARS -->
    <!-- Base Gold Ingot -->
    <g transform="translate(65, 82)">
      <polygon points="0,-12 40,5 0,22 -40,5" fill="url(#bevelLight)" stroke="#FFFDF0" stroke-width="0.8"/>
      <polygon points="-40,5 0,22 0,34 -40,17" fill="url(#goldBevelSide)"/>
      <polygon points="0,22 40,5 40,17 0,34" fill="#B45309"/>
    </g>

    <!-- Top Solid Gold Ingot (Sharp, Gleaming) -->
    <g transform="translate(65, 54)">
      <polygon points="0,-14 38,5 0,24 -38,5" fill="url(#heavyGold)" stroke="#FFFFFF" stroke-width="1"/>
      <polygon points="-38,5 0,24 0,36 -38,17" fill="url(#goldBevelSide)"/>
      <polygon points="0,24 38,5 38,17 0,36" fill="#D97706"/>

      <!-- Hallmark Stamp -->
      <text x="0" y="8" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="8" font-weight="900" fill="#451A03" text-anchor="middle" letter-spacing="1.5">
        999.9 GOLD
      </text>
    </g>

    <!-- Green Momentum Arrow -->
    <path d="M 20,92 Q 45,82 65,56 T 100,20" fill="none" stroke="url(#glowGreen)" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="100,20 88,24 94,33" fill="#10B981"/>

    <!-- Specular Diamond Star Glint -->
    <g transform="translate(102, 48)" filter="url(#goldGlint)">
      <path d="M 0,-10 Q 1,-1 10,0 Q 1,1 0,10 Q -1,1 -10,0 Q -1,-1 0,-10 Z" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="2" fill="#FFFBEB"/>
    </g>
  </g>

  <!-- ==================== LARGE, BOLD, BORDERLESS TYPOGRAPHY ==================== -->
  <g transform="translate(170, 15)">
    
    <!-- LINE 1: BIG BOLD BRAND TITLE -->
    <text x="2" y="58" font-family="'Montserrat', 'Arial Black', Impact, sans-serif" font-size="52" font-weight="900" fill="#000000" letter-spacing="2" opacity="0.9">
      BULLION RATES
    </text>

    <!-- Foreground: Metallic Gold BULLION + Crisp Platinum White RATES -->
    <text x="0" y="56" font-family="'Montserrat', 'Arial Black', Impact, sans-serif" font-size="52" font-weight="900" letter-spacing="2">
      <tspan fill="url(#heavyGold)">BULLION</tspan>
      <tspan fill="url(#platinumWhite)">RATES</tspan>
    </text>

    <!-- BOLD METALLIC "GLOBAL" BADGE -->
    <g transform="translate(495, 14)" filter="url(#bold3D)">
      <rect width="135" height="46" rx="8" fill="#071329" stroke="url(#heavyGold)" stroke-width="2.2"/>
      <circle cx="20" cy="23" r="4.5" fill="#10B981"/>
      <text x="76" y="31" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="19" font-weight="900" fill="url(#heavyGold)" text-anchor="middle" letter-spacing="3.5">
        GLOBAL
      </text>
    </g>

    <!-- LINE 2: CLEAR, BOLD SUBTITLE -->
    <g transform="translate(2, 94)">
      <rect x="0" y="-8" width="5" height="18" rx="2" fill="url(#heavyGold)"/>
      <text x="16" y="6" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0" letter-spacing="3">
        REAL-TIME PRECIOUS METALS, GOLD &amp; FOREX INTELLIGENCE
      </text>
    </g>
  </g>
</svg>
